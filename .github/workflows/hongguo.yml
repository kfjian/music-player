name: hongguo-rank
on:
  schedule:
    - cron: "30 0 * * *"   # 每天台灣時間 08:30
    - cron: "30 10 * * *"  # 每天台灣時間 18:30
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓紅果 AI 劇熱播榜
        run: python3 tools/hongguo_rank.py hongguo.json
      - name: 存回 repo
        run: |
          git config user.name "hongguo-bot"
          git config user.email "hongguo-bot@users.noreply.github.com"
          git add hongguo.json
          git diff --cached --quiet || (git commit -m "紅果 AI 劇熱播榜 $(date -u +%F)" && git push)
